[project]
name = "dera-pipeline"
version = "0.2.0"
description = "SEC DERA Financial Statement Data Sets → Postgres medallion pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
dependencies = [
    "aiohttp>=3.13",
    "pandas>=2.3",
    "lxml>=6.0",
    "psycopg[binary]>=3.2",
    "pandas-market-calendars>=5.4.0",
]

[project.scripts]
dera = "dera_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dera_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot change what CI enforces.
# Pyflakes, the pycodestyle errors, and import ordering; nothing stylistic.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

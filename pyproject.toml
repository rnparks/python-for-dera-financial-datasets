[project]
name = "dera-pipeline"
version = "0.2.0"
description = "SEC DERA Financial Statement Data Sets → Postgres medallion pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
dependencies = [
    "aiohttp>=3.13",
    "pandas>=2.3",
    "lxml>=6.0",
    "psycopg[binary]>=3.2",
    "pandas-market-calendars>=5.4.0",
]

[project.scripts]
dera = "dera_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dera_pipeline"]

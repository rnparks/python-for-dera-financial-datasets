# Lint and unit tests on every push and pull request. No database: the
# data-correctness suite (`dera verify`) and the documentation checker
# (`dera verify-docs`) need the 141 GB Postgres and run locally; the
# pre-commit hook in tools/hooks/ covers the second.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest -q
